{% extends 'base.html' %}
{% load static %}

{% block title %}{{ post.title }} — Victor Ng'eno{% endblock %}

{% block main_content %}
<section id="post-detail" class="post-detail">
    <div class="post-detail-container">
        {% if post.draft %}
        <span class="draft-label">[DRAFT]</span>
        {% endif %}
        <p class="content-markdown">{{ post.content }}</p>
        <a href="{% url 'blog' %}" class="back-link">&larr; Back to blog</a>
    </div>
</section>
{% endblock main_content %}
